name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-latest:
    name: install latest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run setup-dq
        id: setup
        uses: ./
        with:
          version: latest

      - name: Smoke test
        shell: bash
        env:
          VERSION: ${{ steps.setup.outputs.version }}
          BIN_PATH: ${{ steps.setup.outputs.bin-path }}
        run: |
          dq --version
          dq --help > /dev/null
          test -n "$VERSION"
          test -d "$BIN_PATH"

  install-pinned:
    name: install pinned (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve a known release tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/mazuninky/dq/releases/latest --jq '.tag_name')
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Run setup-dq with explicit version
        id: setup
        uses: ./
        with:
          version: ${{ steps.tag.outputs.version }}

      - name: Verify version matches
        shell: bash
        env:
          WANT: ${{ steps.tag.outputs.version }}
          GOT: ${{ steps.setup.outputs.version }}
        run: |
          dq --version | grep -F "$WANT"
          test "$GOT" = "$WANT"

  # actionlint (syntax, expressions, shellcheck on `run:` scripts) and zizmor
  # (security audits, configured in .github/zizmor.yml). zizmor runs offline:
  # its online audits follow upstream branches and tags, which would turn a
  # required check red without a change in this repository.
  workflows:
    name: workflows (actionlint + zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: zizmor@1.32.0

      # go install checks the module against the Go checksum database.
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        run: zizmor --offline --min-severity low --format github .
  # The one required status check: the branch ruleset requires this job
  # instead of each job above, whose names change with the matrix.
  ci-success:
    name: ci-success
    needs: [install-latest, install-pinned, workflows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All CI checks passed"
