version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # A release must age a week before Dependabot proposes it; security
    # updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        update-types:
          - patch
          - minor
